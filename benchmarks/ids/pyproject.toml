[project]
name = "omw-id-token-bench"
version = "0.1.0"
description = "Token counts of oh-my-webbridge ID encodings across LLM tokenizers"
requires-python = ">=3.14"
dependencies = [
  "httpx>=0.28.1",
  "matplotlib>=3.10",
  "pandas>=2.3",
  "seaborn>=0.13.2",
  "tabulate>=0.9",
  "tiktoken>=0.12",
  "tokenizers>=0.22",
]

[dependency-groups]
dev = ["ruff>=0.14"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv]
package = false

[tool.ruff.lint]
extend-select = ["B", "I", "UP"]
