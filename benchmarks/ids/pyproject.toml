[project]
name = "omw-id-token-bench"
version = "0.1.0"
description = "Token counts of oh-my-webbridge ID encodings across LLM tokenizers"
requires-python = ">=3.14"
dependencies = [
  "adjusttext>=1.4.0",
  "cuid2>=2.3.0",
  "httpx>=0.28.1",
  "matplotlib>=3.10",
  "nanoid>=2.0.0",
  "pandas>=2.3",
  "pymongo>=4.19.0",
  "python-ulid>=4.1.0",
  "seaborn>=0.13.2",
  "sonyflake>=2.0.3",
  "svix-ksuid>=0.7.0",
  "tabulate>=0.9",
  "tiktoken>=0.12",
  "time-machine>=3.6.0",
  "tokenizers>=0.22",
]

[dependency-groups]
dev = ["ruff>=0.14"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv]
package = false

[tool.ruff.lint]
extend-select = ["B", "I", "UP"]
