# The root package is listed so Changesets versions it with the workspace.
packages:
  - "."
  - docs
  - extension/ui
  - packages/*
allowBuilds:
  esbuild: false
minimumReleaseAgeExclude:
  - fumadocs-extras@0.2.0
# Scripts run against the installed tree; `pnpm install` is the explicit step.
verifyDepsBeforeRun: false
