name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  benchmark:
    uses: ./.github/workflows/benchmark.yml
  package:
    needs: [verify, benchmark]
    uses: ./.github/workflows/package.yml
    with:
      benchmark_artifact: browser-benchmark-${{ github.sha }}
      artifact_prefix: release-assets
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: dist/release/
      - name: Upload to draft, verify digests, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs
