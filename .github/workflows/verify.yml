name: verify
on:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Ensure zstd is available
        run: bash scripts/ensure-zstd.sh
      - uses: ./.github/actions/setup
      - run: git show-ref --verify --quiet refs/heads/main || git branch main origin/main
      - run: pnpm run release:check
      - run: pnpm run build
      - run: pnpm run check
      - run: pnpm run format:check
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -trimpath -ldflags='-s -w' -o dist/omw ./cmd/omw
      - run: pnpm test
      - run: node scripts/install-test-chrome.mjs
      - run: pnpm run test:e2e
      - name: Ensure gpg is available
        run: |
          if ! command -v gpg >/dev/null; then
            if [ "$RUNNER_OS" = macOS ]; then brew install gnupg; else sudo apt-get install -y gnupg; fi
          fi
      - run: node scripts/install-test-firefox.mjs
      - run: pnpm run test:e2e:firefox-page
      - run: pnpm run test:e2e:firefox
      - run: pnpm run test:e2e:dual
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: verification-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            dist/qa/
            dist/extension.sha256.json
            dist/extension-firefox.sha256.json
            dist/extension/filter-report.json
          retention-days: 7
