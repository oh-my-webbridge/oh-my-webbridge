name: browser benchmarks
on:
  workflow_call:
    inputs:
      smoke:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      smoke:
        type: boolean
        default: false
  schedule:
    - cron: "23 4 * * 1"
permissions:
  contents: read
concurrency:
  group: benchmark-${{ github.ref }}-${{ inputs.smoke || false }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup
      # The comparator tools are a separate npm project with their own lockfile.
      - run: npm ci --ignore-scripts --prefix benchmarks/tools
      - run: pnpm run build
      - run: go build -trimpath -ldflags='-s -w' -o dist/omw ./cmd/omw
      - run: node scripts/install-test-chrome.mjs
        env:
          OMW_CHROMEDRIVER: "true"
      - run: node benchmarks/prepare.mjs
      - name: Measure isolated interfaces and preset resource costs
        env:
          OMW_BENCH_ROUNDS: ${{ inputs.smoke && '1' || '3' }}
          OMW_BENCH_SMOKE: ${{ inputs.smoke && 'true' || 'false' }}
        run: node benchmarks/run.mjs
      - name: Publish report in run summary
        if: always()
        run: test ! -f dist/benchmarks/report.md || cat dist/benchmarks/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: browser-benchmark-${{ github.sha }}
          path: dist/benchmarks/
          retention-days: 30
          overwrite: true
